# RCM MuJoCo 连接入口；先启动 config/robots/rcm/mjcf/mujoco.yaml 对应的仿真器。
schema_version: 1
robot_config: robots/rcm/robot.yaml
device_config: devices/rcm_sim/device.yaml
user_config: user.yaml
http_host: "0.0.0.0"
http_port: 8080
http_control_ttl_seconds: 300
scripts: scripts
web_root: ../web
tool_library: tools
logging:
  directory: ../logs
  file_level: info
  console_level: info
  max_file_size_mib: 50
  max_files: 20
  flush_interval_ms: 1000
diagnostics:
  host: "0.0.0.0"
  port: 8082
  max_sse_clients: 4
  max_downloads: 1
