  - id: 0
    type: driver
    joint_name: joint_1
    limit:
      lower: 0.02
      upper: 0.68
      vel: 0.1
      acc: 5.0
      jerk: 50.0
      effort: 0
    transform:
      ratio: 1.0
      offset_pos_cnt: 0
      cnt_per_unit: -13107200
      torque_per_unit: 1.0
      user_unit_name: m
    inputs:
      status_word: Status word
      position_actual_value: Actual position
      digital_inputs: Digital Inputs
    outputs:
      control_word: Control Word
      mode_of_operation: Operation mode
      target_position: Target Position

