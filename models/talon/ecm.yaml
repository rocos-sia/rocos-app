# ROCOS-ECM startup configuration. Relative paths are based on this directory.
eni: eni7.xml
id: 0
duration: 0           # ms; 0 = run until stopped
cycle: 1000           # us
verbose: 3           # 0 = silent; larger values increase logging
cpuidx: 0            # SDK CPU index [0, 31]; defaults to id if omitted
perf: 1              # 0 = off, 1 = timing, 2 = histogram
auxclk: 0            # reserved; Linux uses cycle, only 0 is supported
sp: 6000             # RAS server port; null or omitted = disabled
log: ""              # log file prefix; relative to this directory; empty = SDK default
flash: null          # output flashing: null/omitted = disabled, 0 = all, otherwise slave address
dcmmode: 1           # 0 = off, 1 = busshift, 2 = mastershift, 3/4 = link/master ref clock, 5 = DCX (SDK support required)
ctloff: false        # disable DCM control loop for diagnosis
link: IntelGbeRec       # I8254x, I8255x, IntelGbe, IntelGbeRec, RTL8169 -> libemll<name>.so
instance: 2          # NIC instance from 1;
mode: 1              # 0 = interrupt, 1 = polling; RTL8169 supports polling only
state: op            # init, preop, safeop, op
license: "D783FABB-D1036502-0DC63002"
maxbusslaves: 256     # SDK preallocated slave capacity, not the shared-memory capacity
mbxsrv: null         # mailbox gateway port (e.g. 34980); null/omitted = disabled

